# EnPreNiNet Configuration (Single Source of Truth)
# All paths are relative to the repository root unless overridden via CLI arguments.

project:
  name: "EnPreNiNet"
  seed: 42
  device: "auto" # "auto", "cpu", or "cuda"

paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  data_dummy: "data/dummy"
  data_dummy_processed: "data/dummy_processed"
  images_raw_subdir: "images/raw"
  splits_subdir: "splits"
  yolo_subdir: "annotations/yolo"
  coco_subdir: "annotations/coco"
  ghe_images_root: "images"
  runs_dir: "runs"
  weights_dir: "weights"
  artifacts_dir: "artifacts"

dataset:
  timeofday: "night"
  image_size: 640
  channels: 3
  classes:
    0: "car"
    1: "person"
    2: "traffic light"
  bdd_class_mapping:
    car: 0
    person: 1
    traffic light: 2
  splits:
    train: 0.70
    val: 0.20
    test: 0.10
  dummy_samples:
    train: 7
    val: 2
    test: 1

preprocessing:
  ghe_ensemble:
    image_size: 640
    gaussian_kernel_size: 3
    gaussian_sigma: 2.0
    window_size: 15 # [OPEN] W x W sliding window for local histogram equalization
    output_channels: 3
    method: "standard_local_he" # "fig4_literal" | "fig4_normalized" | "standard_local_he"
    border_mode: "reflect" # "reflect" | "replicate" | "constant"
    zero_division_policy: "identity" # "identity" | "zero"
    uniform_window_policy: "identity" # "identity" | "stretch" (applies to standard_local_he)

models:
  yolov5:
    variant: "yolov5l" # Big variant (CSPDarknet + PANet), pinned to v7.0 on Colab
    img_size: 640
    batch_size: 16
    epochs: 50
    conf_thres: 0.25 # Reference operating threshold (inference uses CLI --score-floor 0.001 for full PR curve)
    iou_thres: 0.45 # Reference YOLOv5 default (detect.py uses fusion.intra_nms_iou)
    weights: "weights/full/yolov5l_enpreninet.pt" # Default relative path template (isolated by --run-id)

  faster_rcnn:
    backbone: "resnet152" # PyTorch equivalent to paper's ResNet-150 (resnet_fpn_backbone)
    pretrained: true
    num_classes: 4 # 3 target classes (1..3) + 1 background (0)
    img_size: 640
    batch_size: 2 # Safer default for Colab T4 16GB GPU with ResNet-152 FPN
    epochs: 20
    learning_rate: 0.005
    momentum: 0.9
    weight_decay: 0.0005
    weights: "weights/full/frcnn_resnet152_enpreninet.pth" # Default relative path template (isolated by --run-id)

fusion:
  confidence_thresholds: [0.25, 0.50, 0.75]
  default_conf_threshold: 0.25
  intra_nms_iou: 0.50
  global_nms_iou: 0.50
  global_nms_enabled: true # Toggle for ablation (with vs. without global NMS)

evaluation:
  iou_thresholds: [0.50, 0.75]
  metrics: ["precision", "recall", "f1", "map50", "map75"]
